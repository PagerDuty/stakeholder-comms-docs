
# netlify.toml — stakeholders.pagerduty.com
# This site now only redirects to docs.pagerduty.com/ops-guides/stakeholder-comms-guide.

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# These are attached to the 301 responses too. Referrer-Policy matters here:
# a redirect response's Referrer-Policy is applied to the follow-up request,
# so "same-origin" would strip the referrer when the browser goes on to
# docs.pagerduty.com (cross-origin), and docs analytics would lose the
# original traffic source (Google, blogs, Slack, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Redirects — first match wins. Keep the catch-all LAST.
# force = true is required because the old MkDocs build output (if still
# deployed) would otherwise shadow these rules.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide"
  status = 301
  force = true

[[redirects]]
  from = "/definitions/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide/definitions"
  status = 301
  force = true

[[redirects]]
  from = "/mechanisms/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide/mechanisms"
  status = 301
  force = true

[[redirects]]
  from = "/considerations/templates/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide/templates"
  status = 301
  force = true

[[redirects]]
  from = "/considerations/frequency/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide/frequency"
  status = 301
  force = true

# PLACEHOLDER: the four "During the incident" phase pages have not been
# migrated to the new docs yet (they were hidden from the old nav). Until
# they exist, send them to the landing page. Point each rule at its new
# page before merging, once the docs team adds them.
[[redirects]]
  from = "/during/investigation/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide"
  status = 301
  force = true

[[redirects]]
  from = "/during/identification/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide"
  status = 301
  force = true

[[redirects]]
  from = "/during/monitoring/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide"
  status = 301
  force = true

[[redirects]]
  from = "/during/resolution/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide"
  status = 301
  force = true

[[redirects]]
  from = "/nextsteps/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide/next-steps"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide/additional-resources"
  status = 301
  force = true

# Catch-all: assets, sitemap.xml, search index, /considerations/,
# /during/, unknown/mistyped URLs
[[redirects]]
  from = "/*"
  to = "https://docs.pagerduty.com/ops-guides/stakeholder-comms-guide"
  status = 301
  force = true
